name: CI - Validacion de Calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    #  Levanta un Postgres real e idéntico al tuyo en el servidor
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: walo
          POSTGRES_PASSWORD: walo123
          POSTGRES_DB: walo_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Generar cliente de Prisma
        run: npx prisma generate
    
      - name: Crear archivo .env para el Build
        run: |
          echo "DATABASE_URL=postgresql://walo:walo123@localhost:5433/walo_dev?schema=public" >> .env
          echo "NEXTAUTH_SECRET=un-secreto-muy-largo-y-seguro-para-build-123456" >> .env
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env

      - name: Ejecutar Build (Compilacion)
        run: npm run build